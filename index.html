<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Ethiopian New Year 2019</title>
    <!-- Tailwind CSS included via CDN for single-file portability -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Animations */
      @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
      }
      .bg-heart {
        position: absolute;
        bottom: -100px;
        color: rgba(244, 63, 94, 0.2); /* rose-500/20 */
        animation: floatUp linear infinite;
        pointer-events: none;
      }
      
      @keyframes clickHeartAnim {
        0% { transform: scale(0); opacity: 1; margin-top: 0; }
        50% { transform: scale(1.5); }
        100% { transform: scale(1); opacity: 0; margin-top: -150px; }
      }
      .click-heart {
        position: absolute;
        color: rgba(251, 113, 133, 1); /* rose-400 */
        filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.8));
        pointer-events: none;
        animation: clickHeartAnim 1.5s ease-out forwards;
        transform-origin: center;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .card-enter {
        animation: fadeIn 0.8s ease-out forwards;
      }

      @keyframes messageTransition {
        0% { opacity: 0; filter: blur(10px); transform: translateY(20px); }
        100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
      }
      .message-enter {
        animation: messageTransition 0.5s ease-out forwards;
      }

      /* Base styles to prevent text selection and handle clicks */
      body {
        user-select: none;
        -webkit-user-select: none;
        margin: 0;
        overflow: hidden;
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-rose-950 via-purple-950 to-slate-950 min-h-screen w-full relative flex items-center justify-center font-sans">
    
    <!-- Background Floating Hearts -->
    <div id="bg-hearts-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Main Content Card -->
    <div class="relative z-10 w-full max-w-lg px-6 pointer-events-none">
      <div class="card-enter bg-black/40 backdrop-blur-xl border border-rose-500/30 rounded-3xl p-8 sm:p-12 shadow-2xl text-center flex flex-col items-center pointer-events-auto relative overflow-hidden">
        
        <!-- Decorative Sparkles (Raw SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute top-6 left-6 text-yellow-500/50 w-6 h-6 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" class="absolute bottom-6 right-6 text-yellow-500/50 w-6 h-6 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>

        <div class="min-h-[160px] flex items-center justify-center w-full">
          <h1 id="message-text" class="message-enter text-2xl sm:text-3xl md:text-4xl text-rose-100 font-medium leading-relaxed tracking-wide whitespace-pre-wrap drop-shadow-md">
            <!-- Dynamically filled with JS -->
          </h1>
        </div>

        <button id="next-btn" class="mt-12 px-8 py-4 bg-gradient-to-r from-rose-600 to-pink-600 text-white rounded-full font-medium text-lg shadow-[0_0_30px_rgba(225,29,72,0.4)] hover:shadow-[0_0_40px_rgba(225,29,72,0.6)] hover:scale-105 active:scale-95 transition-all duration-300 flex items-center gap-3 cursor-pointer">
          Next ✨
        </button>
      </div>
    </div>

    <div class="absolute bottom-6 text-rose-300/40 text-sm font-light pointer-events-none tracking-widest uppercase">
      Tap anywhere for a surprise
    </div>

    <script>
      const MESSAGES = [
        "Melkam Addis Amet! ✨\nHappy  New Year 2019!  \n herane",
        "As we step into this beautiful new year...",
        "I just wanted to take a moment to tell you how incredibly special you are to me.",
        "Every time we talk, you bring such a big smile to my face and so much warmth to my heart.",
        "Even though we are talking through screens right now, you feel so close.",
        "May this 2019 bring you endless joy, beautiful moments, and all the love you truly deserve.",
        "I'm so grateful to have you in my life. Here's to us, and to an amazing year ahead! ❤️"
      ];

      let currentStep = 0;
      const messageEl = document.getElementById('message-text');
      const nextBtn = document.getElementById('next-btn');
      const bgHeartsContainer = document.getElementById('bg-hearts-container');

      function updateMessage() {
        // Retrigger CSS transition animation
        messageEl.classList.remove('message-enter');
        void messageEl.offsetWidth; // Force DOM reflow
        messageEl.classList.add('message-enter');
        
        messageEl.innerText = MESSAGES[currentStep];
        
        if (currentStep === MESSAGES.length - 1) {
          nextBtn.innerText = "Read again ❤️";
        } else {
          nextBtn.innerText = "Next ✨";
        }
      }

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Stop click from propagating to the background (avoids spawning click heart)
        if (currentStep < MESSAGES.length - 1) {
          currentStep++;
        } else {
          currentStep = 1; // Loop back to the first romantic message
        }
        updateMessage();
      });

      // Spawn Background Floating Hearts
      for (let i = 0; i < 30; i++) {
        const heartContainer = document.createElement('div');
        heartContainer.className = 'bg-heart';
        
        const size = 16 + Math.random() * 32;
        heartContainer.style.width = `${size}px`;
        heartContainer.style.height = `${size}px`;
        heartContainer.style.left = `${Math.random() * 100}%`;
        heartContainer.style.animationDuration = `${10 + Math.random() * 20}s`;
        heartContainer.style.animationDelay = `${Math.random() * 10}s`;
        
        // Inline SVG Heart
        heartContainer.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
        
        bgHeartsContainer.appendChild(heartContainer);
      }

      // Interactive Click Hearts
      document.body.addEventListener('click', (e) => {
        // Prevent heart spawn if clicking on the 'Next' button
        if (e.target.closest('button')) return;

        const clickHeart = document.createElement('div');
        clickHeart.className = 'click-heart';
        clickHeart.style.left = `${e.clientX - 24}px`;
        clickHeart.style.top = `${e.clientY - 24}px`;
        clickHeart.style.width = '48px';
        clickHeart.style.height = '48px';
        
        clickHeart.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
        
        document.body.appendChild(clickHeart);
        
        // Remove element from DOM after animation completes (1.5s)
        setTimeout(() => {
          clickHeart.remove();
        }, 1500);
      });

      // Initialize First Message
      updateMessage();
    </script>
  </body>
</html>
